<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Jobs</title>
</head>
<body>
    <h1>Sample Job Postings</h1>
    <ul>
        {% for job in jobs %}
            <li>
                <h2>{{ job.title }}</h2>
                <p>Company: {{ job.company }}</p>
                <a href="{{ job.link }}">Apply Now</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
